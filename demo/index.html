<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@olecve/leaflet-velocity demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="mapid"></div>
    <button id="remove">Remove Wind</button>
    <button id="add">Add Wind</button>
    <hr />
    <p>
      Simulates playback through a time series (alternates between two synthetic frames once a second) to compare the
      two ways of pushing new data into a running layer.
    </p>
    <button id="play-set-data">Play via setData() (hard reset)</button>
    <button id="play-update-data">Play via updateData() (smooth)</button>
    <p id="stats">frames: 0 · canvas clears: 0</p>
    <hr />
    <p>Presets change particle density, speed, trail length, and color. Each one calls setOptions().</p>
    <label for="preset">Preset:</label>
    <select id="preset">
      <option value="default">Default</option>
      <option value="dense-slow">Dense, slow</option>
      <option value="sparse-fast">Sparse, fast</option>
      <option value="long-trails">Long trails</option>
      <option value="blue-palette">Blue palette</option>
    </select>
    <p id="preset-info"></p>
    <script type="module" src="main.ts"></script>
  </body>
</html>
